[package]
name = "deplo-blake3-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "BLAKE3 hashing for DEPLO's Cloudflare Pages asset keys, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure Rust implementation: no C compiler or SIMD intrinsics needed for wasm32.
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
