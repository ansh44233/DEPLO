name: Bootstrap lockfiles (temporary)

# One-off: the authoring environment cannot reach npm or crates.io, so this run
# creates package-lock.json, Cargo.lock and lib/deploy/blake3.wasm on the branch,
# records the lint result, and commits them back. It is deleted in the next commit.

on:
  push:
    branches: [fix/audit-findings]
    paths: [".github/workflows/bootstrap-lockfiles.yml", "package.json", "native/**"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve npm dependencies and write package-lock.json
        run: npm install --no-audit --no-fund
      - name: Build the Rust hasher (writes Cargo.lock and lib/deploy/blake3.wasm)
        run: rustup target add wasm32-unknown-unknown && ./native/blake3-wasm/build.sh
      - name: Record lint and type results for review
        run: |
          mkdir -p .bootstrap
          npx eslint . -f json -o .bootstrap/eslint.json || true
          npx tsc --noEmit > .bootstrap/tsc.txt 2>&1 || true
          npm audit --omit=dev --json > .bootstrap/audit.json || true
          node -e "console.log(require('next/package.json').version)" > .bootstrap/next-version.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json native/blake3-wasm/Cargo.lock lib/deploy/blake3.wasm .bootstrap
          git commit -m "Add package-lock.json, Cargo.lock and the built BLAKE3 hasher" || echo "nothing to commit"
          git push
