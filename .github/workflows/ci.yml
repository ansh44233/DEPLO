name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate migration inventory
        run: npm run check:migrations
      - name: Set up Rust for the BLAKE3 WebAssembly hasher
        run: rustup target add wasm32-unknown-unknown
      - name: Build and test the Rust hasher
        # Writes lib/deploy/blake3.wasm so the unit tests below check it against the JavaScript implementation.
        run: ./native/blake3-wasm/build.sh
      - name: Unit tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
